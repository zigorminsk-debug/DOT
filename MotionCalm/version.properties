# Версия приложения. Меняется при каждом релизе:
#  versionName - человекочитаемая версия (1.1);
#  versionCode - номер сборки: целое число, у каждого нового релиза больше предыдущего.
# CI собирает APK с этими значениями и публикует релиз с тегом v<versionName>-build<versionCode>.
versionName=1.2
versionCode=3
