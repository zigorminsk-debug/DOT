plugins {
    id 'com.android.application'
}

// Версия берётся из MotionCalm/version.properties (versionName и номер сборки versionCode).
def versionProps = new Properties()
rootProject.file('version.properties').withInputStream { versionProps.load(it) }
def appVersionName = versionProps.getProperty('versionName')
def appVersionCode = versionProps.getProperty('versionCode').toInteger()

// Постоянный ключ подписи релиза передаётся переменными окружения (в CI — из GitHub Secrets).
// Сам файл ключа в репозиторий не кладём. Если переменных нет, release-сборка не подписывается,
// а CI такой APK не публикует.
def releaseKeystore = System.getenv('RELEASE_KEYSTORE')

android {
    namespace 'com.example.motioncalm'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.motioncalm"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storeType System.getenv('RELEASE_KEYSTORE_TYPE') ?: 'pkcs12'
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Реальный org.json нужен для тестов разбора ответа GitHub: заглушка из android.jar не работает на JVM
    testImplementation 'org.json:json:20231013'
}
