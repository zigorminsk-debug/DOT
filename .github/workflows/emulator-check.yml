name: Проверка на эмуляторе

# Проверка на эмуляторе Android: служба подсказок должна продолжать работу после выключения
# и включения экрана. Отдельный запуск, он не блокирует выпуск релиза. Красный результат
# означает, что после блокировки подсказки могут пропасть.
on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'MotionCalm/**'
      - '.github/workflows/emulator-check.yml'
      - '.github/scripts/emulator_smoke.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Выключить и включить экран
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: MotionCalm
    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Установить JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Собрать отладочный APK
        run: sh ./gradlew --no-daemon --console=plain assembleDebug

      - name: Включить KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Выключить и включить экран на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash "${{ github.workspace }}/.github/scripts/emulator_smoke.sh" "${{ github.workspace }}/MotionCalm/app/build/outputs/apk/debug/app-debug.apk"
